<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Hotel Travel</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="Corpo">
    <h1 class="Titulo">Hotel Travel - Reservas</h1>
    
    <nav>
        <button><a href="index.html" class="Link">Início</a></button>
        <button><a href="contato.html" class="Link">Contato</a></button>
        <button><a href="sobre.html" class="Link">Sobre nós</a></button>
        <button><a href="servicos.html" class="Link">Serviços</a></button>
        <button id="theme-toggle">🌙</button>
    </nav>

    <p class="Paragrafo">
        Faça sua reserva conosco e aproveite os melhores preços e promoções exclusivas. Nossa plataforma de reservas permite que você escolha entre diferentes tipos de quartos, períodos e serviços adicionais para personalizar sua experiência.
    </p>

    <h2>Formulário de Reserva</h2>
    <form>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required>
        
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="data-entrada">Data de Entrada:</label>
        <input type="date" id="data-entrada" name="data-entrada" required>
        
        <label for="data-saida">Data de Saída:</label>
        <input type="date" id="data-saida" name="data-saida" required>
        
        <label for="quarto">Tipo de Quarto:</label>
        <select id="quarto" name="quarto" required>
            <option value="">Selecione um quarto</option>
            <option value="simples">Quarto Simples</option>
            <option value="duplo">Quarto Duplo</option>
            <option value="suite">Suíte Executiva</option>
            <option value="cobertura">Suíte Cobertura</option>
        </select>
        
        <button type="submit">Confirmar Reserva</button>
    </form>
    <script>
        const toggle = document.getElementById('theme-toggle');
        const body = document.body;
        function updateIcon() {
            toggle.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
        }
        toggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
            updateIcon();
        });
        if (localStorage.getItem('theme') === 'dark') body.classList.add('dark');
        updateIcon();
    </script>
</body>
</html>
